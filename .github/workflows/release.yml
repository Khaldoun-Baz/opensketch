name: Release

# Push a tag like `v0.2.0` (matching the version in Cargo.toml) to build
# OpenSketch for Windows, macOS and Linux and publish a GitHub Release with the
# notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          dir="opensketch-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp README.md LICENSE CHANGELOG.md "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/opensketch.exe "$dir/"
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            cp target/release/opensketch "$dir/"
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads
          | Platform | File |
          |---|---|
          | Windows (64-bit) | `opensketch-*-windows-x86_64.zip`: unzip and run `opensketch.exe` |
          | macOS (Apple Silicon) | `opensketch-*-macos-arm64.tar.gz`: extract and run `opensketch` |
          | Linux (x86_64) | `opensketch-*-linux-x86_64.tar.gz`: extract and run `./opensketch` |

          The downloads aren't code-signed yet. On Windows, if SmartScreen says
          "Windows protected your PC", click **More info ▸ Run anyway**. On macOS,
          right-click the file ▸ **Open** the first time (or run
          `xattr -d com.apple.quarantine opensketch`).
          EOF
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "OpenSketch $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
