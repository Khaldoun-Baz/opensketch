[package]
name = "opensketch"
version = "0.1.1"
edition = "2021"
authors = ["Khaldoun Baz <https://github.com/Khaldoun-Baz>"]
description = "A SketchUp-style push/pull 3D modeler written in Rust"
license = "MIT"
repository = "https://github.com/Khaldoun-Baz/opensketch"
readme = "README.md"
keywords = ["cad", "3d", "modeling", "sketchup", "egui"]
categories = ["graphics", "rendering", "gui"]
rust-version = "1.88"

[dependencies]
eframe = "0.31"
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcutr = "0.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
